name: release

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish to Maven Central (auto-release) and GitHub Packages
        env:
          # vanniktech reads these as Gradle properties via the ORG_GRADLE_PROJECT_ prefix.
          ORG_GRADLE_PROJECT_mavenCentralUsername:    ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword:    ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey:      ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

          # GitHub Packages credentials (auto-provided by Actions).
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew \
            :spring-mediator-core:publishAndReleaseToMavenCentral \
            :spring-mediator-autoconfigure:publishAndReleaseToMavenCentral \
            :spring-mediator-starter:publishAndReleaseToMavenCentral \
            :spring-mediator-core:publishMavenPublicationToGithubRepository \
            :spring-mediator-autoconfigure:publishMavenPublicationToGithubRepository \
            :spring-mediator-starter:publishMavenPublicationToGithubRepository \
            -Pversion=${RELEASE_VERSION} \
            --no-configuration-cache
