name: release

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 1) Maven Central — root-level invocation so vanniktech aggregates all
      #    three publishable subprojects into a single Central Portal deployment.
      #    Per-subproject invocation silently no-ops with the Central Portal host.
      - name: Publish to Maven Central (auto-release)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername:        ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword:        ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey:          ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:  ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishAndReleaseToMavenCentral \
            -Pversion=${RELEASE_VERSION} \
            --no-configuration-cache \
            --info \
            --stacktrace

      # 2) GitHub Packages — separate step so a GHP-side hiccup doesn't roll
      #    back the Central Portal release. continue-on-error keeps the job
      #    green when GHP itself burps; Maven Central is the source of truth.
      - name: Publish to GitHub Packages
        if: always()
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew \
            :spring-mediator-core:publishMavenPublicationToGithubRepository \
            :spring-mediator-autoconfigure:publishMavenPublicationToGithubRepository \
            :spring-mediator-starter:publishMavenPublicationToGithubRepository \
            -Pversion=${RELEASE_VERSION} \
            --no-configuration-cache
