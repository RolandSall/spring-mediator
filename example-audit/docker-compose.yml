services:
  spring-mediator-audit-db:
    image: postgres:16-alpine
    container_name: spring-mediator-audit-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: audit_example
    ports:
      - "5435:5432"
    volumes:
      - audit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  audit_pgdata:
